[package]
name = "stash-desktop"
version = "0.1.0"
description = "Stash Desktop — onboarding, health checks, and the background curator"
authors = ["Fergana Labs"]
edition = "2021"

[lib]
name = "stash_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
gethostname = "1"
tauri-plugin-dialog = "2.7.2"

# Tauri's Linux GTK3 backend requires glib 0.18. This revision is the 0.18.5
# release plus the two-line VariantStrIter fix from gtk-rs/gtk-rs-core#1343.
[patch.crates-io]
glib = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "67cb73c083bb87d623283ea684f532b18be4c7a9" }
# Keep GTK and glib on the same FFI types across the dependency graph.
glib-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "67cb73c083bb87d623283ea684f532b18be4c7a9" }
gobject-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "67cb73c083bb87d623283ea684f532b18be4c7a9" }
gio-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "67cb73c083bb87d623283ea684f532b18be4c7a9" }
