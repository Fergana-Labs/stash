name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected suites
    runs-on: ubuntu-latest
    outputs:
      www: ${{ steps.scope.outputs.www }}
      frontend: ${{ steps.scope.outputs.frontend }}
      python: ${{ steps.scope.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check suite selection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select suites
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            set -o pipefail
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" | python3 .github/scripts/ci_scope.py >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/ci_scope.py --all >> "$GITHUB_OUTPUT"
          fi

  www-test:
    needs: changes
    if: needs.changes.outputs.www == 'true'
    name: Marketing site tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
        working-directory: www
      - run: npm test
        working-directory: www

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend build (next build + type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          # next.config.ts fails loud without a backend origin; the build
          # itself never contacts it.
          BACKEND_INTERNAL_URL: http://localhost:3456

  backend-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Pinned to requirements-dev.txt so CI and local runs format identically —
      # an unpinned formatter drifts style across releases and re-reds every PR.
      - run: pip install "$(grep '^ruff==' backend/requirements-dev.txt)"
      - run: ruff check backend/ cli/
      - run: ruff format --check backend/ cli/

  migration-graph:
    name: Migration graph (single head)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge below needs a merge base, which a depth-1 clone lacks.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "$(grep '^alembic' backend/requirements.txt)"
      # GitHub builds the PR merge ref from main as of the branch's last push
      # and does not re-run workflows when main moves, so this job can pass
      # against a base that is weeks stale — #965 did, and collided with a
      # migration that had landed on main in the meantime. Merging main here
      # makes the check see the tree that will actually be deployed.
      - name: Merge current main
        run: |
          git fetch origin main
          git -c user.name='Stash CI' -c user.email='ci@joinstash.ai' merge --no-commit --no-ff FETCH_HEAD || {
            echo "::error::This branch conflicts with main; rebase onto main."
            exit 1
          }
      # Two PRs merging migrations onto the same parent leave alembic with two
      # heads and break every deploy (#712 + #713 both shipped "0125").
      - run: python backend/migrations/check_heads.py

  plugin-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install plugin test dependencies
        run: pip install -r backend/requirements-dev.txt -e .

      - name: Run plugin tests
        run: python -m pytest plugins/tests --no-cov

  cli-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install CLI test dependencies
        run: pip install -r backend/requirements-dev.txt -e .

      - name: Run CLI tests
        run: python -m pytest cli/tests --no-cov

  backend-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stash
          POSTGRES_PASSWORD: stash
          POSTGRES_DB: stash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://stash:stash@localhost:5432/stash_test
          TEST_DATABASE_URL: postgresql://stash:stash@localhost:5432/stash_test
        run: python -m alembic upgrade head

      - name: Run pytest with coverage
        env:
          DATABASE_URL: postgresql://stash:stash@localhost:5432/stash_test
          TEST_DATABASE_URL: postgresql://stash:stash@localhost:5432/stash_test
        run: python -m pytest -v
