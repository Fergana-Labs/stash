[pytest]
# CLI runs scope coverage to the cli package itself instead of the root backend
# gate. When the CLI suite is invoked by its path (e.g. `pytest cli/tests`), the
# rootdir is anchored at this directory and this config is selected, so its
# addopts apply cli-package-scoped coverage and replace the root pytest.ini's
# backend-scoped gate. This keeps a flagless CLI run passing on its own gate.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = --cov=cli --cov-report=term-missing --cov-fail-under=45
